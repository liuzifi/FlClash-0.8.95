name: build-android-apk

# 仅在 Actions 页面手动触发（Run workflow）。
#
# 触发时可输入完整版本号（如 0.8.96、0.8.97），直接覆盖默认版本号。
# 不填则版本号保持 BASE_VERSION（0.8.95），versionCode 用时间戳自动生成。
#
# 产出：
#   - APK：FlClash-{version}-android-arm64-v8a.apk（固定签名）
#   - GitHub Release：含 APK + Source code (zip/tar.gz)
#
# 注意：刻意不使用 push/tags 触发。仓库自带的官方 build.yaml 会在推送 v* 标签时
# 运行，而它依赖官方 Secrets（KEYSTORE / SERVICE_JSON 等），在个人 fork 上必然
# 失败并产生误导。如需按标签构建，可自行在此追加 push: tags: ['v*']。
#
# 产出：已应用 trojan no-TLS + xhttp 补丁及 vless xhttp 断流修复的 Android APK（arm64-v8a）。
on:
  workflow_dispatch:
    inputs:
      version_override:
        description: '完整版本号，如 0.8.96（留空则使用默认 0.8.95）'
        required: false
        default: ''
      create_release:
        description: '构建后创建 GitHub Release'
        required: false
        default: 'true'

env:
  FLUTTER_VERSION: '3.44.4'
  # FlClash 0.8.95 锁定的内核提交（= tag flclash/v0.8.95）
  CLASH_META_REPO: https://github.com/chen08209/Clash.Meta.git
  CLASH_META_REF: 0f7f05adff5e2c49775a112dcfe05a6aa36fda0c
  # 基础版本号（不含后缀）
  BASE_VERSION: '0.8.95'

jobs:
  apk:
    name: Build APK (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：Release 说明需要用 git log 对比上一个 tag 以来的提交
          fetch-depth: 0

      # 根据 workflow_dispatch 输入计算最终版本号，并更新 pubspec.yaml。
      # version_override 直接指定完整 3 段版本号（如 0.8.96），不填则用 BASE_VERSION。
      # pubspec version 格式必须为 X.Y.Z+buildNumber（3 段语义化版本 + 整数构建号）。
      - name: Set version
        id: version
        run: |
          override="${{ github.event.inputs.version_override }}"
          if [ -n "$override" ]; then
            version="$override"
          else
            version="${BASE_VERSION}"
          fi
          # versionCode：时间戳（秒），确保递增
          code=$(date +%s)
          # 更新 pubspec.yaml（version 字段 = 3 段版本 + 整数 build number）
          sed -i "s/^version: .*/version: ${version}+${code}/" pubspec.yaml
          # version_name 用于 APK 文件名和 Release tag，与 pubspec version 一致
          echo "version_name=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"
          echo "::notice::Version: ${version} (code: ${code})"

      # core/go.mod 使用 `replace github.com/metacubex/mihomo => ./Clash.Meta`，
      # 因此必须把完整内核源码填入 core/Clash.Meta，并打上 trojan no-TLS + xhttp 补丁，
      # 以及 vless xhttp 断流修复补丁（stream-one 下 recvResponse 与 WaitReadCloser 死锁）。
      - name: Clone mihomo core and apply patches
        run: |
          set -euo pipefail
          rm -rf core/Clash.Meta
          git clone --filter=blob:none "$CLASH_META_REPO" core/Clash.Meta
          cd core/Clash.Meta
          git checkout "$CLASH_META_REF"
          git apply -v "$GITHUB_WORKSPACE/trojan-notls.patch"
          git apply -v "$GITHUB_WORKSPACE/trojan-xhttp.patch"
          git apply -v "$GITHUB_WORKSPACE/vless-xhttp.patch"
          echo "--- patches applied, changed files ---"
          git --no-pager diff --stat

      # 内核 go.mod 仅声明 `go 1.20`，而 FlClash 官方 CI 使用 1.26.4 构建该内核，
      # 这里与官方保持一致（用 go-version-file 会解析出过低版本）。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/Clash.Meta/go.sum

      # 预先编译被补丁改动的包，尽早暴露语法/类型错误，避免到 APK 阶段才失败。
      - name: Verify patched core compiles
        working-directory: core/Clash.Meta
        env:
          CGO_ENABLED: '0'
        run: |
          go build -tags=with_gvisor ./adapter/outbound/... ./transport/... ./listener/...

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      # 应用 release 构建所需的本地文件。
      # 优先使用仓库 Secrets 提供的固定签名 keystore / Firebase 配置；
      # 缺失时回退到自签名 keystore + 占位 google-services，保证任何场景都能出包。
      - name: Prepare local build files
        env:
          # 固定签名（base64 编码的 jks + 四件套）。未配置则为空字符串。
          KEYSTORE:        ${{ secrets.KEYSTORE }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          # Firebase google-services.json（base64）。未配置则为空字符串。
          SERVICE_JSON:    ${{ secrets.SERVICE_JSON }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE" ] && [ -n "$KEY_ALIAS" ] \
             && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "::notice::Using fixed keystore from Secrets."
            printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } >> android/local.properties
          else
            echo "::warning::No keystore secrets found; using self-signed keystore. APK will not be officially signed."
            keytool -genkeypair -v \
              -keystore android/app/keystore.jks \
              -storetype PKCS12 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              echo "storePassword=android"
              echo "keyAlias=androiddebugkey"
              echo "keyPassword=android"
            } >> android/local.properties
          fi

          if [ -n "$SERVICE_JSON" ]; then
            echo "::notice::Using official google-services.json from Secrets."
            printf '%s' "$SERVICE_JSON" | base64 --decode > android/app/google-services.json
          else
            echo "::warning::No SERVICE_JSON secret; using placeholder google-services.json. Firebase features will be inert."
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "flclash-trojan-notls",
              "storage_bucket": "flclash-trojan-notls.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.follow.clash"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

          # Flutter 编译期环境变量文件。
          # APP_ENV=stable → isPre=false，主界面右上角不显示预发布标签。
          # 可选值参考 state.dart：'stable'（正式）、'pre'（预发布）、'dev'（开发，会崩溃上报）。
          echo '{"APP_ENV":"stable"}' > env.json

          # 传给 Gradle setup 插件的 NDK / 架构信息。
          if [ -n "${ANDROID_NDK_ROOT:-}" ]; then
            echo "ANDROID_NDK=${ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_ARCH=arm64" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      # 触发 Gradle assembleRelease，其 setup 插件会调用 build_tool
      # （go build -buildmode=c-shared -tags=with_gvisor）生成 libclash.so，
      # 再由 CMake 链入 APK。
      - name: Build release APK (arm64-v8a)
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define-from-file=env.json

      # 构建后重命名 APK 为官方风格命名：FlClash-{version}-android-arm64-v8a.apk
      - name: Rename APK
        id: apk
        run: |
          version="${{ steps.version.outputs.version_name }}"
          apk_name="FlClash-${version}-android-arm64-v8a.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${apk_name}"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
          echo "::notice::APK renamed to ${apk_name}"
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ steps.version.outputs.version_name }}-android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 生成本次 Release 说明：以"自上一个 Release tag 以来的实际提交"为更新内容，
      # 避免每次发布重复同一份写死的说明；首个版本（无 tag）列出全部提交。
      - name: Generate release notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version_name }}"
          prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..HEAD"
            base_desc="${prev_tag}"
          else
            range="HEAD"
            base_desc="项目起始"
          fi
          commits="$(git log --no-merges --pretty=format:'- %s (%h)' "${range}" 2>/dev/null || true)"
          {
            echo "## FlClash v${version}"
            echo ""
            echo "### 本版更新（自 ${base_desc} 以来）"
            echo ""
            if [ -n "$commits" ]; then
              echo "${commits}"
            else
              echo "- 无新增提交（同版本号重新构建）"
            fi
            echo ""
            echo "### 下载"
            echo "- APK: FlClash-${version}-android-arm64-v8a.apk（Android arm64）"
            echo "- Source code (zip) / Source code (tar.gz)：完整源码"
            echo ""
            echo "### 安装"
            echo "- 固定签名，可与历史版本直接覆盖安装。"
            echo "- 内核: mihomo ${CLASH_META_REF} + Trojan no-TLS / xhttp 补丁及 vless xhttp 断流修复。"
          } > release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md

      # 构建成功后创建 GitHub Release，包含 APK + Source code。
      # 仅在 create_release 输入为 'true' 时执行。说明内容来自 release_notes.md。
      - name: Create GitHub Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: FlClash v${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          files: |
            dist/*.apk
          generate_release_notes: true
